<router-outlet />

<form class="card" (ngSubmit)="onSubmit()" novalidate>
  <h1 class="card__title">כניסה להתקנת תוכנות לימודיות על המחשב</h1>

  <div class="field">
    <label class="field__label" for="idNumber">מספר זהות</label>
    <input
      class="field__input"
      id="idNumber"
      name="idNumber"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      dir="ltr"
      [value]="idNumber()"
      (input)="onIdNumberChange($event)"
    />
  </div>

  <div class="field field--checkbox">
    <input
      class="field__checkbox"
      id="isTermsApproved"
      name="isTermsApproved"
      type="checkbox"
      [checked]="isTermsApproved()"
      (change)="onApprovalChange($event)"
    />
    <label class="field__label" for="isTermsApproved">האם קראת ואישרת את התקנון</label>
  </div>

  <button class="submit" type="submit" [disabled]="!isFormValid()">היכנס</button>
</form>
